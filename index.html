<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ليدو الاستثنائي - الأصلي 🎲</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #0f172a; color: white; text-align: center; padding: 10px; margin: 0; }
        h1 { font-size: 1.8rem; margin: 10px; text-shadow: 0 0 15px #38bdf8; }
        #game { background: #1e293b; border-radius: 20px; padding: 15px; max-width: 480px; margin: 0 auto; border: 3px solid #334155; }
        canvas { background: white; border-radius: 15px; border: 3px solid #38bdf8; display: block; margin: 10px auto; max-width: 100%; }
        button { background: #ef4444; color: white; border: none; padding: 14px 30px; font-size: 1.2rem; border-radius: 12px; cursor: pointer; margin: 8px; font-family: 'Cairo'; font-weight: bold; }
        button:disabled { background: #64748b; }
        #dice { font-size: 3.5rem; margin: 8px; }
        #turn { font-size: 1.2rem; margin: 8px; font-weight: bold; }
        #result { font-size: 1rem; margin: 5px; color: #94a3b8; min-height: 25px; }
    </style>
</head>
<body>
    <h1>🎲 ليدو الاستثنائي - الأصلي</h1>
    <div id="game">
        <div id="turn">الدور: اللاعب الأحمر</div>
        <canvas id="board" width="450" height="450"></canvas>
        <div id="dice">🎲</div>
        <button id="rollBtn" onclick="rollDice()">ارمي النرد</button>
        <div id="result">ارمي 6 عشان تطلع</div>
    </div>
<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const rollBtn = document.getElementById('rollBtn');
const colors = ['#dc2626', '#16a34a', '#ca8a04', '#2563eb'];
const players = ['أحمر', 'أخضر', 'أصفر', 'أزرق'];
const s = 30;
let currentPlayer = 0;
let diceValue = 0;
let canRoll = true;
const mainPath = [{x:6,y:13},{x:6,y:12},{x:6,y:11},{x:6,y:10},{x:6,y:9},{x:5,y:8},{x:4,y:8},{x:3,y:8},{x:2,y:8},{x:1,y:8},{x:0,y:8},{x:0,y:7},{x:0,y:6},{x:1,y:6},{x:2,y:6},{x:3,y:6},{x:4,y:6},{x:5,y:6},{x:6,y:5},{x:6,y:4},{x:6,y:3},{x:6,y:2},{x:6,y:1},{x:6,y:0},{x:7,y:0},{x:8,y:0},{x:8,y:1},{x:8,y:2},{x:8,y:3},{x:8,y:4},{x:8,y:5},{x:9,y:6},{x:10,y:6},{x:11,y:6},{x:12,y:6},{x:13,y:6},{x:14,y:6},{x:14,y:7},{x:14,y:8},{x:13,y:8},{x:12,y:8},{x:11,y:8},{x:10,y:8},{x:9,y:8},{x:8,y:9},{x:8,y:10},{x:8,y:11},{x:8,y:12},{x:8,y:13},{x:8,y:14},{x:7,y:14},{x:6,y:14}];
const homePaths = [[{x:7,y:13},{x:7,y:12},{x:7,y:11},{x:7,y:10},{x:7,y:9},{x:7,y:8}],[{x:1,y:7},{x:2,y:7},{x:3,y:7},{x:4,y:7},{x:5,y:7},{x:6,y:7}],[{x:7,y:1},{x:7,y:2},{x:7,y:3},{x:7,y:4},{x:7,y:5},{x:7,y:6}],[{x:13,y:7},{x:12,y:7},{x:11,y:7},{x:10,y:7},{x:9,y:7},{x:8,y:7}]];
const startPos = [0, 13, 26, 39];
const safeSpots = [0, 8, 13, 21, 26, 34, 39, 47];
const homeBases = [[{x:1.5,y:1.5},{x:4.5,y:1.5},{x:1.5,y:4.5},{x:4.5,y:4.5}],[{x:1.5,y:10.5},{x:4.5,y:10.5},{x:1.5,y:13.5},{x:4.5,y:13.5}],[{x:10.5,y:1.5},{x:13.5,y:1.5},{x:10.5,y:4.5},{x:13.5,y:4.5}],[{x:10.5,y:10.5},{x:13.5,y:10.5},{x:10.5,y:13.5},{x:13.5,y:13.5}]];
let pieces = [[{pos:-1},{pos:-1}],[{pos:-1},{pos:-1}],[{pos:-1},{pos:-1}],[{pos:-1},{pos:-1}]];
function drawBoard() {
    ctx.fillStyle = 'white'; ctx.fillRect(0, 0, 450, 450);
    ctx.fillStyle = '#dc2626'; ctx.fillRect(0, 0, 6*s, 6*s);
    ctx.fillStyle = '#16a34a'; ctx.fillRect(0, 9*s, 6*s, 6*s);
    ctx.fillStyle = '#ca8a04'; ctx.fillRect(9*s, 0, 6*s, 6*s);
    ctx.fillStyle = '#2563eb'; ctx.fillRect(9*s, 9*s, 6*s);
    ctx.fillStyle = '#e5e7eb'; mainPath.forEach(p => ctx.fillRect(p.x*s, p.y*s, s, s));
    for(let p=0; p<4; p++) { ctx.fillStyle = colors[p]; homePaths[p].forEach(pos => ctx.fillRect(pos.x*s, pos.y*s, s, s)); }
    ctx.fillStyle = '#dc2626'; ctx.fillRect(6*s, 13*s, s, s);
    ctx.fillStyle = '#16a34a'; ctx.fillRect(1*s, 6*s, s, s);
    ctx.fillStyle = '#ca8a04'; ctx.fillRect(8*s, 1*s, s, s);
    ctx.fillStyle = '#2563eb'; ctx.fillRect(13*s, 8*s, s, s);
    ctx.strokeStyle = '#000'; ctx.lineWidth = 1;
    for(let i = 0; i <= 15; i++) { ctx.beginPath(); ctx.moveTo(i*s, 0); ctx.lineTo(i*s, 450); ctx.stroke(); ctx.beginPath(); ctx.moveTo(0, i*s); ctx.lineTo(450, i*s); ctx.stroke(); }
    safeSpots.forEach(pos => { let p = mainPath[pos]; ctx.fillStyle = '#374151'; ctx.beginPath(); ctx.arc(p.x*s+s/2, p.y*s+s/2, 9, 0, 2*Math.PI); ctx.fill(); ctx.fillStyle = 'white'; ctx.font = 'bold 16px Arial'; ctx.fillText('★', p.x*s+s/2-6, p.y*s+s/2+6); });
    ctx.fillStyle = '#dc2626'; ctx.beginPath(); ctx.moveTo(7.5*s,7.5*s); ctx.lineTo(6*s,9*s); ctx.lineTo(9*s,9*s); ctx.fill();
    ctx.fillStyle = '#16a34a'; ctx.beginPath(); ctx.moveTo(7.5*s,7.5*s); ctx.lineTo(6*s,6*s); ctx.lineTo(6*s,9*s); ctx.fill();
    ctx.fillStyle = '#ca8a04'; ctx.beginPath(); ctx.moveTo(7.5*s,7.5*s); ctx.lineTo(6*s,6*s); ctx.lineTo(9*s,6*s); ctx.fill();
    ctx.fillStyle = '#2563eb'; ctx.beginPath(); ctx.moveTo(7.5*s,7.5*s); ctx.lineTo(9*s,6*s); ctx.lineTo(9*s,9*s); ctx.fill();
    ctx.fillStyle = 'white'; homeBases.forEach(base => { base.forEach(b => { ctx.beginPath(); ctx.arc(b.x*s, b.y*s, 14, 0, 2*Math.PI); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); }); });
    for(let p=0; p<4; p++) { for(let i=0; i<4; i++) { let piece = pieces[p][i]; let x, y; if(piece.pos === -1) { x = homeBases[p][i].x * s; y = homeBases[p][i].y * s; } else if(piece.pos >= 100) { let homeIdx = piece.pos - 100; x = homePaths[p][homeIdx].x * s + s/2; y = homePaths[p][homeIdx].y * s + s/2; } else { let pos = (startPos[p] + piece.pos) % 52; x = mainPath[pos].x * s + s/2; y = mainPath[pos].y * s + s/2; } ctx.fillStyle = colors[p]; ctx.beginPath(); ctx.arc(x, y, 10, 0, 2*Math.PI); ctx.fill(); ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke(); if(p === currentPlayer && canMove(p, i)) { ctx.strokeStyle = '#fbbf24'; ctx.lineWidth = 4; ctx.stroke(); } } }
}
function canMove(player, pieceIdx) { if(diceValue === 0) return false; let piece = pieces[player][pieceIdx]; if(piece.pos === -1) return diceValue === 6; if(piece.pos >= 100) return piece.pos - 100 + diceValue < 6; return true; }
function rollDice() { if(!canRoll) return; diceValue = Math.floor(Math.random()*6)+1; document.getElementById('dice').textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][diceValue-1]; let canMoveAny = false; for(let i=0; i<4; i++) if(canMove(currentPlayer, i)) canMoveAny = true; if(!canMoveAny) { document.getElementById('result').textContent = `مافي حركة! طلع ${diceValue}`; setTimeout(nextTurn, 1500); } else { document.getElementById('result').textContent = `طلع ${diceValue} - اختار قطعة`; canRoll = false; rollBtn.disabled = true; } drawBoard(); }
function nextTurn() { if(diceValue!== 6) currentPlayer = (currentPlayer+1)%4; diceValue = 0; canRoll = true; rollBtn.disabled = false; document.getElementById('turn').textContent = `الدور: اللاعب ${players[currentPlayer]}`; document.getElementById('turn').style.color = colors[currentPlayer]; document.getElementById('result').textContent = 'ارمي النرد'; drawBoard(); checkWin(); }
function checkWin() { for(let p=0; p<4; p++) { let won = true; for(let i=0; i<4; i++) { if(pieces[p][i].pos!== 105) won = false; } if(won) { document.getElementById('result').textContent = `🎉 مبروك! اللاعب ${players[p]} فاز!`; rollBtn.disabled = true; } } }
canvas.addEventListener('click', (e) => { if(canRoll || diceValue === 0) return; const rect = canvas.getBoundingClientRect(); const x = (e.clientX - rect.left) * (450/rect.width); const y = (e.clientY - rect.top) * (450/rect.height); for(let i=0; i<4; i++) { let piece = pieces[currentPlayer][i]; let px, py; if(piece.pos === -1) { px = homeBases[currentPlayer][i].x * s; py = homeBases[currentPlayer][i].y * s; } else if(piece.pos >= 100) { let homeIdx = piece.pos - 100; px = homePaths[currentPlayer][homeIdx].x * s + s/2; py = homePaths[currentPlayer][homeIdx].y * s + s/2; } else { let pos = (startPos[currentPlayer] + piece.pos) % 52; px = mainPath[pos].x * s + s/2; py = mainPath[pos].y * s + s/2; } let dist = Math.sqrt((x-px)**2 + (y-py)**2); if(dist < 15 && canMove(currentPlayer, i)) { if(piece.pos === -1) { piece.pos = 0; } else if(piece.pos < 100) { piece.pos += diceValue; if(piece.pos >= 51) piece.pos = 100 + (piece.pos - 51); } else { piece.pos += diceValue; } if(piece.pos < 100) { let currentPos = (startPos[currentPlayer] + piece.pos) % 52; if(!safeSpots.includes(currentPos)) { for(let p=0; p<4; p++) { if(p === currentPlayer) continue; for(let j=0; j<4; j++) { let other = pieces[p][j]; if(other.pos >= 0 && other.pos < 100) { let otherPos = (startPos[p] + other.pos) % 52; if(otherPos === currentPos) other.pos = -1; } } } } } nextTurn(); break; } } });
drawBoard();
</script>
</body>
</html>

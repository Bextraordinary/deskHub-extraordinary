<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليدو الاستثنائي 🎲</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Cairo', Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white; text-align: center; padding: 20px; min-height: 100vh;
        }
        h1 { font-size: 2.5rem; margin-bottom: 15px; text-shadow: 0 0 15px #38bdf8; }
        #game {
            background: #1e293b; border-radius: 20px; padding: 20px;
            max-width: 500px; margin: 0 auto; border: 3px solid #334155;
        }
        canvas {
            background: #0f172a; border-radius: 15px;
            border: 3px solid #38bdf8; display: block; margin: 15px auto;
        }
        button {
            background: #ef4444; color: white; border: none; padding: 15px 30px;
            font-size: 1.2rem; border-radius: 12px; cursor: pointer;
            margin: 10px; font-family: 'Cairo'; font-weight: bold;
        }
        button:hover { background: #dc2626; transform: scale(1.05); }
        #dice { font-size: 3rem; margin: 10px; }
        #turn { font-size: 1.3rem; color: #38bdf8; margin: 10px; }
    </style>
</head>
<body>
    <h1>ليدو الاستثنائي 🎲</h1>
    <div id="game">
        <div id="turn">الدور: اللاعب الأحمر</div>
        <canvas id="board" width="450" height="450"></canvas>
        <div id="dice">🎲</div>
        <button onclick="rollDice()">ارمي النرد</button>
        <div id="result"></div>
    </div>

<script>
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const colors = ['#ef4444', '#22c55e', '#eab308', '#3b82f6'];
const players = ['أحمر', 'أخضر', 'أصفر', 'أزرق'];
let currentPlayer = 0;
let diceValue = 1;

// رسم رقعة الليدو
function drawBoard() {
    const size = 30;
    ctx.clearRect(0, 0, 450, 450);

    // الخلفية
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 0, 450, 450);

    // المناطق الملونة
    ctx.fillStyle = '#ef4444'; ctx.fillRect(0, 0, 180, 180);
    ctx.fillStyle = '#22c55e'; ctx.fillRect(270, 0, 180, 180);
    ctx.fillStyle = '#eab308'; ctx.fillRect(0, 270, 180, 180);
    ctx.fillStyle = '#3b82f6'; ctx.fillRect(270, 270, 180, 180);

    // الممرات
    ctx.fillStyle = '#334155';
    for(let i = 0; i < 15; i++) {
        ctx.fillRect(180, i * 30, 90, 30);
        ctx.fillRect(i * 30, 180, 30, 90);
    }

    // المثلث الوسط
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.moveTo(225, 225); ctx.lineTo(180, 180); ctx.lineTo(270, 180); ctx.fill();
    ctx.fillStyle = '#22c55e';
    ctx.beginPath(); ctx.moveTo(225, 225); ctx.lineTo(270, 180); ctx.lineTo(270, 270); ctx.fill();
    ctx.fillStyle = '#3b82f6';
    ctx.beginPath(); ctx.moveTo(225, 225); ctx.lineTo(270, 270); ctx.lineTo(180, 270); ctx.fill();
    ctx.fillStyle = '#eab308';
    ctx.beginPath(); ctx.moveTo(225, 225); ctx.lineTo(180, 270); ctx.lineTo(180, 180); ctx.fill();

    // بيوت اللاعبين
    drawHome(60, 60, '#ef4444');
    drawHome(330, 60, '#22c55e');
    drawHome(60, 330, '#eab308');
    drawHome(330, 330, '#3b82f6');
}

function drawHome(x, y, color) {
    ctx.fillStyle = 'white';
    ctx.fillRect(x-45, y-45, 90, 90);
    ctx.fillStyle = color;
    for(let i = 0; i < 2; i++) {
        for(let j = 0; j < 2; j++) {
            ctx.beginPath();
            ctx.arc(x-20+i*40, y-20+j*40, 15, 0, 2*Math.PI);
            ctx.fill();
        }
    }
}

function rollDice() {
    diceValue = Math.floor(Math.random() * 6) + 1;
    document.getElementById('dice').textContent = ['⚀','⚁','⚂','⚃','⚄','⚅'][diceValue-1];
    document.getElementById('result').textContent = `طلع ليك: ${diceValue}`;

    if(diceValue!== 6) {
        currentPlayer = (currentPlayer + 1) % 4;
    }
    document.getElementById('turn').textContent = `الدور: اللاعب ${players[currentPlayer]}`;
    document.getElementById('turn').style.color = colors[currentPlayer];
}

drawBoard();
</script>
</body>
</html>
